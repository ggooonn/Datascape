[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datascape"
version = "0.1.0"
description = "Data-driven landscape painting and robotic brush plotting"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
research = ["numpy", "scipy", "matplotlib", "rasterio", "opencv-python", "shapely", "PyYAML", "jupyterlab", "ipykernel", "osqp>=1.1,<2"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["datascape*"]
